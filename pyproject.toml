[project]
name = "rag-pro"
version = "0.1.0"
    description = "RAG pipeline with hybrid retrieval, FAISS, and a config-driven LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.14.2",
    "ipykernel>=7.2.0",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.0",
    "langchain-groq>=1.1.2",
    "langchain-ollama>=0.3.0",
    "langchain-text-splitters>=1.1.2",
    "pandas>=3.0.3",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.12.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.5.1",
    "langgraph>=0.2.0",
    "langsmith>=0.2.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40.0",
    "pydantic-settings>=2.0.0",
    "ragas>=0.2.0",
    "pytest>=8.0.0",
    "python-pptx>=1.0.0",
    "huggingface-hub>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
